document_tests:
  document: ./document-set-audit.md
  tests:
    - id: dsa-composition-001
      category: execution
      severity: critical
      reader_role: skill operator
      question: "What two layers must every Mode F audit include, and what question does each layer answer?"
      expected_answer_properties:
        - identifies per-document evaluation as Layer 1 (can each document answer the questions it individually claims?)
        - identifies set-level evaluation as Layer 2 (can the set function coherently for a reader moving across documents?)
        - states that a corpus-level answer does not rescue a document that is expected to be independently complete
      failure_risk: "Operator skips per-document evaluation and produces only a corpus-level pass, missing individual document failures."
      blocking: true

    - id: dsa-gate-001
      category: decisions
      severity: critical
      reader_role: skill operator
      question: "Under what conditions does Mode F return fail, pass_with_warnings, or pass?"
      expected_answer_properties:
        - fail when any per-document blocking critical/high test is not PASS
        - fail when any set-level blocking critical/high test is not PASS
        - fail when any blocking cross-document contradiction exists
        - fail when no document is authoritative for a critical/high reader action
        - pass_with_warnings when all blocking critical/high pass but medium/low gaps remain
        - pass only when all tests pass or non-passing are NOT_APPLICABLE
      failure_risk: "Operator returns pass_with_warnings when a blocking critical failure should force fail."
      blocking: true

    - id: dsa-procedure-001
      category: execution
      severity: high
      reader_role: skill operator
      question: "What are the five procedure steps for a Mode F audit, in order?"
      expected_answer_properties:
        - step 1 inventory the set (roles, audience, authoritative topics, frontmatter)
        - step 2 run per-document evaluation for each document
        - step 3 build the set-level test suite
        - step 4 run set-level evaluation
        - step 5 consolidate the fix plan
      failure_risk: "Operator runs set-level tests before completing per-document evaluation, producing incomplete results."
      blocking: true

    - id: dsa-fix-plan-001
      category: execution
      severity: high
      reader_role: skill operator
      question: "How should I separate findings in the consolidated fix plan?"
      expected_answer_properties:
        - distinguishes per-document fixes (incomplete or ambiguous doc)
        - distinguishes cross-document fixes (contradictions, drift, terminology)
        - distinguishes set-level fixes (routing, missing doc, ownership model)
      failure_risk: "Operator conflates per-document gaps with set-level routing issues, producing an unactionable fix plan."
      blocking: false

    - id: dsa-discoverability-001
      category: decisions
      severity: high
      reader_role: skill operator
      question: "What set-level test category evaluates whether a new reader can navigate the document set without an index, and what are the acceptable fixes for a failed discoverability test?"
      expected_answer_properties:
        - names discoverability as a set-level test category distinct from reader routing
        - states that discoverability tests whether document names, titles, and purpose statements alone guide new readers
        - states that acceptable fixes include renaming documents, improving titles or purpose statements, and adding targeted cross-references
        - states that creating a new routing or index document is not the preferred fix
      failure_risk: "Operator treats every navigation gap as a missing-index problem and adds an index document, creating unnecessary maintenance overhead without improving the underlying organization."
      blocking: false

    - id: dsa-output-shape-001
      category: execution
      severity: medium
      reader_role: skill operator
      question: "What top-level fields must the Mode F evaluation output contain?"
      expected_answer_properties:
        - artifact_type document_set
        - per_document_evaluations array
        - set_level_evaluation with results and cross_document_findings
        - consolidated_fix_plan
      failure_risk: "Operator omits required fields and the output cannot be validated by the schema."
      blocking: false

    - id: dsa-suite-expansion-step2-001
      category: execution
      severity: critical
      reader_role: skill operator
      question: "What additional activity must be performed during Step 2 (per-document evaluation) that goes beyond running the standard evaluation?"
      expected_answer_properties:
        - names the suite expansion pass
        - states it must be run before evaluating each document
        - references resources/workflow.md Suite expansion section for the procedure
        - states candidates are emitted under suite_expansion fix-plan category
      failure_risk: "Operator runs per-document evaluation without a suite expansion pass, missing untested content sections and logically-implied candidate tests."
      blocking: true

    - id: dsa-suite-expansion-step3-001
      category: execution
      severity: high
      reader_role: skill operator
      question: "What four sub-steps make up the set-level test suite derivation procedure in Step 3?"
      expected_answer_properties:
        - step 3a establish derivation inputs from the inventory (combined audience, authoritative-topic map, routing map, undeclared topics)
        - step 3b generate per-category candidate tests for each Layer-2 category
        - step 3c add audience-specific reader-journey candidate tests
        - step 3d classify severity using severity-calibration.md and surface candidates under suite_expansion for operator review
      failure_risk: "Operator builds set-level tests from a blank rubric, missing coverage implied by the document set's own inventory."
      blocking: true

    - id: dsa-gate-stale-frontmatter-001
      category: decisions
      severity: high
      reader_role: skill operator
      question: "Beyond the four common fail conditions, what frontmatter-related condition also causes Mode F to return fail?"
      expected_answer_properties:
        - frontmatter declares conflicting authority OR stale/missing artifact references that affect critical/high tests
      failure_risk: "Operator returns pass_with_warnings when stale frontmatter artifact references are silently degrading the audit quality."
      blocking: true

    - id: dsa-two-phase-001
      category: execution
      severity: high
      reader_role: skill operator
      question: "How does Mode F apply the two-phase separation between evaluator reading and rubric grading, and which frontmatter fields are excluded versus permitted in Phase 1?"
      expected_answer_properties:
        - states per-document evaluation uses Phase 1 read pass before rubric grading
        - states tddoc.tests_inline and tddoc.evaluation are excluded from Phase 1
        - states structural frontmatter fields are permitted in Phase 1 for manifest and routing tests
        - states set-level evaluation uses the same two-phase ordering
        - states expected_answer_properties and failure_risk are applied in grading pass, not initial read
      failure_risk: "Operator either evaluates with embedded rubric visible from the start, or incorrectly refuses structural frontmatter needed for manifest consistency tests."
      blocking: true

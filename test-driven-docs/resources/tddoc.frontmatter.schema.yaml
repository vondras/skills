$schema: "https://json-schema.org/draft/2020-12/schema"
title: "ATDD Document Frontmatter Manifest"
type: object
required:
  - tddoc
additionalProperties: true
properties:
  tddoc:
    type: object
    required:
      - version
      - artifact_type
      - id
      - title
      - audience
      - purpose
      - source_of_truth
    additionalProperties: false
    properties:
      version:
        type: integer
        const: 1
      artifact_type:
        type: string
        enum: [document]
      id:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      title:
        type: string
        minLength: 1
      role_in_set:
        type: string
        minLength: 1
      document_set:
        type: string
        minLength: 1
      audience:
        type: object
        required: [primary]
        additionalProperties: false
        properties:
          primary:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          secondary:
            type: array
            items:
              type: string
              minLength: 1
      purpose:
        type: string
        minLength: 1
      non_goals:
        type: array
        items:
          type: string
          minLength: 1
      expected_reader_actions:
        type: array
        items:
          type: string
          minLength: 1
      source_of_truth:
        type: object
        required: [authority, precedence, conflict_resolution]
        additionalProperties: false
        properties:
          authority:
            type: string
            minLength: 1
          precedence:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          conflict_resolution:
            type: string
            minLength: 1
      authoritative_for:
        type: array
        items:
          type: string
          minLength: 1
      related_documents:
        type: array
        items:
          type: object
          required: [path, relationship]
          additionalProperties: false
          properties:
            path:
              type: string
              minLength: 1
            relationship:
              type: string
              minLength: 1
            notes:
              type: string
      freshness:
        type: object
        required: [expectation, owner]
        additionalProperties: false
        properties:
          expectation:
            type: string
            minLength: 1
          owner:
            type: string
            minLength: 1
          last_reviewed:
            type: string
            format: date
          next_review_due:
            type: string
            format: date
      tests:
        type: object
        required: [suite]
        additionalProperties: false
        properties:
          suite:
            type: string
            minLength: 1
          blocking:
            type: array
            items:
              type: string
              minLength: 1
      tests_inline:
        type: array
        items:
          $ref: "#/$defs/test"
      evaluation:
        type: object
        additionalProperties: false
        properties:
          latest:
            type: string
            minLength: 1
          status:
            type: string
            enum: [pass, fail, pass_with_warnings, not_evaluated]
          evaluated_at:
            type: string
            format: date
          evaluator:
            type: string
            minLength: 1
          document_hash:
            type: string
            pattern: "^sha256:[a-fA-F0-9]{64}$"
    allOf:
      - not:
          required: [tests, tests_inline]
$defs:
  test:
    type: object
    required:
      - id
      - category
      - severity
      - reader_role
      - question
      - expected_answer_properties
      - failure_risk
      - blocking
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*-[0-9]{3}$"
      category:
        type: string
        minLength: 1
      severity:
        type: string
        enum: [critical, high, medium, low]
      reader_role:
        type: string
        minLength: 1
      question:
        type: string
        minLength: 1
      expected_answer_properties:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      failure_risk:
        type: string
        minLength: 1
      blocking:
        type: boolean
      notes:
        type: string

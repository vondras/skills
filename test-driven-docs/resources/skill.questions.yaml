document_tests:
  document: ../SKILL.md
  tests:
    - id: skill-orientation-001
      category: orientation
      severity: high
      reader_role: skill operator
      question: "Under what conditions should I invoke this skill, and when should I NOT force the full workflow onto a request?"
      expected_answer_properties:
        - lists document types the skill is designed for
        - lists specific scenarios that trigger use
        - states when not to apply the full workflow
      failure_risk: "Operator over-applies the skill to lightweight requests or misses cases where it applies."
      blocking: true

    - id: skill-mode-001
      category: decisions
      severity: critical
      reader_role: skill operator
      question: "How do I choose which mode (A–F) to apply to a given user request?"
      expected_answer_properties:
        - names all six modes
        - provides a selection criterion or principle
        - maps at least one scenario to a mode
      failure_risk: "Operator picks the wrong mode, producing unnecessary artifacts or skipping required steps."
      blocking: true

    - id: skill-mode-f-invariant-001
      category: decisions
      severity: critical
      reader_role: skill operator
      question: "What is the structural requirement for Mode F that distinguishes it from running Mode D multiple times?"
      expected_answer_properties:
        - identifies two-layer composition (per-document evaluation AND set-level evaluation)
        - states that Mode F does not replace single-document evaluation — it composes it
        - states the pass condition requires both per-document and set-level tests to pass
      failure_risk: "Operator collapses a document-set audit into one corpus pass, producing incomplete results."
      blocking: true

    - id: skill-routing-001
      category: orientation
      severity: high
      reader_role: skill operator
      question: "Where do I find the detailed procedure for executing a mode, and where do I find the Mode F audit rules?"
      expected_answer_properties:
        - routes to resources/workflow.md for per-phase procedure
        - routes to resources/document-set-audit.md for Mode F
        - routes to resources/frontmatter-manifest.md for frontmatter manifest behavior
      failure_risk: "Operator attempts to execute a mode from SKILL.md alone and misses phase-specific rules."
      blocking: false

    - id: skill-principles-001
      category: governance
      severity: high
      reader_role: skill operator
      question: "What operating principles govern how I evaluate documents and recommend fixes?"
      expected_answer_properties:
        - states that evaluation must use evidence from the document only
        - states that critical/high gaps block unless the user explicitly accepts risk
        - states that fixes should be minimal (smallest safe change)
      failure_risk: "Operator accepts unsupported inferences as passes or rewrites documents beyond what failing tests require."
      blocking: false

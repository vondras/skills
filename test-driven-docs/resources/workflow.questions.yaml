document_tests:
  document: ./workflow.md
  tests:
    - id: workflow-phase-order-001
      category: execution
      severity: critical
      reader_role: skill operator
      question: "What is the standard phase sequence, and what is the minimum output of each phase?"
      expected_answer_properties:
        - names all six phases in order (contract, questions, tests, author/revise, evaluate, remediate)
        - describes the minimum artifact or output for each phase
      failure_risk: "Operator skips phases or produces the wrong artifact type for a phase."
      blocking: true

    - id: workflow-mode-output-001
      category: decisions
      severity: high
      reader_role: skill operator
      question: "What output shape should I produce for each mode (A–F)?"
      expected_answer_properties:
        - defines output structure for Mode A (contract only)
        - defines output structure for Mode B (test suite only)
        - defines output structure for Mode D (evaluation)
        - defines output structure for Mode E (full workflow)
        - routes Mode F to resources/document-set-audit.md
      failure_risk: "Operator delivers the wrong artifact type and the user cannot act on the output."
      blocking: true

    - id: workflow-frontmatter-001
      category: execution
      severity: high
      reader_role: skill operator
      question: "How should I use test-driven-docs frontmatter when it is present in a document being worked on?"
      expected_answer_properties:
        - states to use frontmatter as the starting contract manifest in Phase 1
        - states that referenced tests.suite takes precedence over derived tests
        - identifies what frontmatter is authoritative for (identity, routing, source-of-truth, tests pointer)
      failure_risk: "Operator ignores frontmatter and re-derives the contract and tests, producing unnecessary work or drift."
      blocking: true

    - id: workflow-metadata-drift-001
      category: edge-cases
      severity: high
      reader_role: skill operator
      question: "What should I do when a referenced test suite file is missing, an evaluation file is missing, or a document_hash mismatches?"
      expected_answer_properties:
        - identifies these as metadata-drift findings
        - states to fail evaluation with a metadata-drift finding
        - states to fall back to deriving tests or re-running evaluation
        - states to flag frontmatter as stale in the fix plan
      failure_risk: "Operator silently continues with a stale evaluation stamp or missing suite, producing incorrect results."
      blocking: true

    - id: workflow-pacing-001
      category: decisions
      severity: medium
      reader_role: skill operator
      question: "When should I deliver phases incrementally versus all at once in Mode E?"
      expected_answer_properties:
        - states to default to phase-by-phase delivery for real documents
        - states the condition under which everything-at-once is acceptable
      failure_risk: "Operator dumps all artifacts in one response for a complex document, overwhelming the user."
      blocking: false

    - id: workflow-suite-expansion-001
      category: execution
      severity: critical
      reader_role: skill operator
      question: "Before evaluating against a loaded suite, what pass must be run first, and what are its three activities?"
      expected_answer_properties:
        - names the suite expansion pass
        - activity 1 surface untested content blocks (sections or topics with no corresponding test)
        - activity 2 derive per-document candidate tests from audience, purpose, authoritative_for, existing categories, and body
        - activity 3 derive set-level candidate tests from combined audience, authoritative-topic map, and Layer-2 categories
        - states the pass runs after suite load and before evaluation
      failure_risk: "Operator evaluates against a supplied suite without checking whether the suite itself is complete, missing per-document gaps and set-level coverage holes."
      blocking: true

    - id: workflow-suite-expansion-002
      category: execution
      severity: high
      reader_role: skill operator
      question: "Under what fix-plan category must suite expansion candidates be emitted, and how does it differ from per_document and set_level fix kinds?"
      expected_answer_properties:
        - names suite_expansion as the fix-plan category
        - distinguishes suite_expansion (candidate tests for operator review) from per_document (fix document content) and set_level (fix routing, structure, or ownership)
        - states that candidates are surfaced for operator review rather than silently appended
      failure_risk: "Operator conflates candidate test findings with content fixes, producing an unactionable fix plan."
      blocking: true

    - id: workflow-phase3-001
      category: execution
      severity: high
      reader_role: skill operator
      question: "How do I convert a reader question into a documentation test, and what makes a test well-formed?"
      expected_answer_properties:
        - states each material question becomes a test with expected answer properties
        - shows a YAML template with required fields including id, category, severity, reader_role, question, expected_answer_properties, failure_risk, and blocking
        - states a good test allows an evaluator to distinguish complete, partial, missing, contradictory, and inferred answers
      failure_risk: "Operator produces tests with vague expected properties that cannot distinguish a partial answer from a full pass."
      blocking: false

    - id: workflow-phase4-001
      category: execution
      severity: medium
      reader_role: skill operator
      question: "What guidance does the workflow give for authoring or revising a document against its test suite?"
      expected_answer_properties:
        - states to use the contract and test suite as acceptance criteria
        - states the document should answer tests through coherent structure, not by appending a FAQ
        - provides a recommended section structure for operational or governance documents
        - states to use only the sections that fit the artifact
      failure_risk: "Operator appends a FAQ section to satisfy tests rather than integrating answers into the document's natural structure."
      blocking: false

    - id: workflow-eval-two-phase-001
      category: execution
      severity: high
      reader_role: skill operator
      question: "How must Phase 5 separate evaluator reading from rubric grading, and which frontmatter fields are excluded versus permitted in Phase 1?"
      expected_answer_properties:
        - defines a Phase 1 reading pass using question, reader_role, document body, and structural frontmatter
        - states tddoc.tests_inline is excluded from Phase 1 to prevent rubric leakage
        - states tddoc.evaluation is excluded from Phase 1 to prevent verdict leakage
        - prohibits exposing expected_answer_properties and failure_risk during Phase 1
        - defines a Phase 2 grading pass that applies expected_answer_properties and failure_risk
      failure_risk: "Operator either primes evaluation with embedded rubric or incorrectly blocks structural frontmatter needed for manifest consistency tests."
      blocking: true
